name: Build UNICA Android Production AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-android-aab.yml"

permissions:
  contents: read

jobs:
  build:
    name: Generate signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0

      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Verify signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" || (echo "Missing secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KSP" || (echo "Missing secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KALIAS" || (echo "Missing secret ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KP" || (echo "Missing secret ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/unica-manager-upload.jks"
          chmod 600 "$GITHUB_WORKSPACE/app/unica-manager-upload.jks"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: unica-manager-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Rename bundle
        run: cp app/build/outputs/bundle/release/app-release.aab unica-manager-1.0.3-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: unica-manager-1.0.3-aab
          path: unica-manager-1.0.3-release.aab
          retention-days: 14
          if-no-files-found: error
